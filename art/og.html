<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 76% 22%,#39406f 0%,#171430 38%,#0b0a17 75%)}

p{margin:26px 0 0;font-size:32px;font-weight:700;opacity:.9;line-height:1.3}
